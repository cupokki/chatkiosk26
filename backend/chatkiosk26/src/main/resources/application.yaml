spring:
  application:
    name: chatkiosk26
  datasource:
    url: jdbc:postgresql://localhost:5432/chatkiosk26
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: user123
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        enabled: true
        options:
          model: gpt-4o
          temperature: 0.7

langchain4j:
  openai:
    api-key: ${OPENAI_API_KEY}
    model-name: gpt-4o
    temperature: 0.7
    timeout: 60s